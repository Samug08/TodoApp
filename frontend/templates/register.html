{% extends 'base.html' %}
{% block title %}Registrati · TodoApp{% endblock %}
{% block content %}
<section class="sheet">
  <div class="sheet-head">
    <img class="app-icon" src="{{ url_for('static', filename='image/logo.png') }}" alt="" width="64" height="64">
    <h1 class="title-l">Crea il tuo account</h1>
    <p class="subtitle">Bastano un nome utente e una password.</p>
  </div>
  <form method="post" class="form">
    <div class="field-group">
      <label class="field">
        <span class="field-label">Nome utente</span>
        <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" autocomplete="new-password" required>
      </label>
    </div>
    <button type="submit" class="btn btn-primary btn-lg btn-block">Registrati</button>
  </form>
  <p class="sheet-foot">Hai già un account? <a href="/login">Accedi</a></p>
</section>
{% endblock %}
