{% extends 'base.html' %}
{% block title %}Nuovo promemoria · TodoApp{% endblock %}
{% block content %}
<section class="sheet">
  {{ ui.back() }}
  <div class="sheet-head sheet-head-left">
    <h1 class="title-l">Nuovo promemoria</h1>
    <p class="subtitle">Cosa devi fare?</p>
  </div>
  <form method="post" class="form">
    <div class="field-group">
      <label class="field">
        <span class="field-label">Titolo</span>
        <input type="text" name="todo" placeholder="Es. Chiamare il dentista" value="{{ request.form.get('todo', '') }}" required autofocus>
      </label>
      <label class="field">
        <span class="field-label">Note</span>
        <textarea name="info" rows="3" placeholder="Aggiungi dettagli (facoltativo)">{{ request.form.get('info', '') }}</textarea>
      </label>
    </div>
    <button type="submit" class="btn btn-primary btn-lg btn-block">Aggiungi promemoria</button>
  </form>
</section>
{% endblock %}
