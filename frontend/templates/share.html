{% extends 'base.html' %}
{% block title %}Condividi · TodoApp{% endblock %}
{% block content %}
<section class="sheet">
  {{ ui.back() }}
  <div class="sheet-head sheet-head-left">
    <h1 class="title-l">Condividi</h1>
    <p class="subtitle">Invia una copia di questo promemoria a un altro utente.</p>
  </div>
  <form method="post" class="form">
    <div class="field-group">
      <label class="field">
        <span class="field-label">Nome utente</span>
        <input type="text" name="username" placeholder="Con chi vuoi condividerlo?" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
    </div>
    <button type="submit" class="btn btn-primary btn-lg btn-block">{{ ui.icon('share', 18) }}<span>Condividi promemoria</span></button>
  </form>
</section>
{% endblock %}
