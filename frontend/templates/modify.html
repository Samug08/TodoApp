{% extends 'base.html' %}
{% block title %}Modifica · TodoApp{% endblock %}
{% block content %}
<section class="sheet">
  {{ ui.back() }}
  <div class="sheet-head sheet-head-left">
    <h1 class="title-l">Modifica</h1>
    <p class="subtitle">Aggiorna il titolo o le note del promemoria.</p>
  </div>
  <form method="post" class="form">
    <div class="field-group">
      <label class="field">
        <span class="field-label">Titolo</span>
        <input type="text" name="todo" placeholder="Titolo del promemoria" value="{{ todo.todo }}" required autofocus>
      </label>
      <label class="field">
        <span class="field-label">Note</span>
        <textarea name="info" rows="3" placeholder="Aggiungi dettagli (facoltativo)">{{ todo.info or '' }}</textarea>
      </label>
    </div>
    <button type="submit" class="btn btn-primary btn-lg btn-block">Salva modifiche</button>
  </form>
</section>
{% endblock %}
